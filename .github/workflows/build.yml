name: Build NeedTODO Flutter
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test server/test.mjs
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter build windows --release --dart-define=NEEDTODO_API_URL=${{ vars.NEEDTODO_API_URL }}
      - shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          foreach ($name in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -LiteralPath (Join-Path $env:WINDIR "System32/$name") -Destination $release
          }
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' ).Matches.Groups[1].Value -split '\+')[0]
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is missing.' }
          & $compiler.FullName "/DAppReleaseVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NeedTODO-Windows
          path: |
            release/*.exe
            build/windows/x64/runner/Release/
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter build apk --debug --dart-define=NEEDTODO_API_URL=${{ vars.NEEDTODO_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: NeedTODO-Android-Test
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter build ios --release --no-codesign --dart-define=NEEDTODO_API_URL=${{ vars.NEEDTODO_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: NeedTODO-iOS-Unsigned
          path: build/ios/iphoneos/Runner.app
