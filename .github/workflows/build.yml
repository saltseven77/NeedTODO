name: Build NeedTODO Flutter
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test server/test.mjs
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter build windows --release --dart-define=NEEDTODO_API_URL=${{ vars.NEEDTODO_API_URL || 'https://api.whatineedtodotoday.xyz' }}
      - shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          foreach ($name in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -LiteralPath (Join-Path $env:WINDIR "System32/$name") -Destination $release
          }
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' ).Matches.Groups[1].Value -split '\+')[0]
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is missing.' }
          & $compiler.FullName "/DAppReleaseVersion=$version" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NeedTODO-Windows
          path: |
            release/*.exe
            build/windows/x64/runner/Release/
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          encoded = os.environ.get('ANDROID_KEYSTORE_BASE64')
          if encoded:
              key = Path(os.environ['RUNNER_TEMP']) / 'needtodo-release.jks'
              key.write_bytes(base64.b64decode(encoded))
              key.chmod(0o600)
              values = {'storeFile': str(key), 'storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'], 'keyAlias': os.environ['ANDROID_KEY_ALIAS'], 'keyPassword': os.environ['ANDROID_KEY_PASSWORD']}
              properties = Path('android/key.properties')
              properties.write_text(''.join(f'{k}={v}\n' for k, v in values.items()))
              properties.chmod(0o600)
          PY
      - name: Build Android
        run: |
          if [ -f android/key.properties ]; then mode=release; else mode=debug; fi
          flutter build apk --$mode --dart-define=NEEDTODO_API_URL=${{ vars.NEEDTODO_API_URL || 'https://api.whatineedtodotoday.xyz' }}
      - name: Verify packaged notification resource
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          tools = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/aapt2'))
          for apk in Path('build/app/outputs/flutter-apk').glob('*.apk'):
              output = subprocess.check_output([str(tools[-1]), 'dump', 'resources', str(apk)], text=True)
              if 'drawable/ic_notification' not in output:
                  raise SystemExit('Notification icon was removed from the APK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NeedTODO-Android
          path: build/app/outputs/flutter-apk/*.apk
  ios:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter build ios --release --no-codesign --dart-define=NEEDTODO_API_URL=${{ vars.NEEDTODO_API_URL || 'https://api.whatineedtodotoday.xyz' }}
      - uses: actions/upload-artifact@v4
        with:
          name: NeedTODO-iOS-Unsigned
          path: build/ios/iphoneos/Runner.app
